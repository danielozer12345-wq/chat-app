<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Sniper Duel</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Courier New', Courier, monospace;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #030712;
      touch-action: none;
    }

    /* מסך התחלה */
    #start-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #030712;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      gap: 20px;
      padding: 20px;
    }

    #start-overlay h1 {
      color: #00f0ff;
      font-size: 28px;
      letter-spacing: 3px;
      text-shadow: 0 0 15px #00f0ff;
      text-align: center;
    }

    #start-btn {
      padding: 16px 36px;
      font-size: 18px;
      font-weight: 900;
      color: #030712;
      background: #00f0ff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
    }

    /* זירת המשחק */
    .arena {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #030712;
    }

    /* וידאו היריב במסך מלא */
    #peer-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(130%) brightness(85%) hue-rotate(180deg) saturate(180%);
      opacity: 0.75;
      transform: scaleX(-1);
    }

    /* תצוגת מצלמה עצמית קטנה בפינה */
    #my-video {
      position: absolute;
      bottom: 20px;
      left: 15px;
      width: 90px;
      height: 120px;
      object-fit: cover;
      border: 2px solid #00f0ff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
      z-index: 10;
      transform: scaleX(-1);
    }

    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 240, 255, 0.12) 51%);
      background-size: 100% 4px;
      z-index: 2;
    }

    .hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    #alert-banner {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      text-align: center;
      width: 90%;
      color: #ff0055;
      text-shadow: 0 0 15px #ff0055;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #alert-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }

    .hp-bar {
      position: absolute;
      width: 130px;
      height: 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.5);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
      transform: skewX(-20deg);
      overflow: hidden;
      padding: 1px;
    }

    .enemy-hp { top: 15px; left: 15px; border-color: #ff0055; }
    .my-hp { top: 15px; right: 15px; }

    .hp-bar .fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #00f0ff, #38bdf8);
      transition: width 0.25s ease;
    }

    .enemy-hp .fill { background: linear-gradient(90deg, #ff0055, #ff5500); }

    /* כוונת עכבר / טאץ' */
    .target-crosshair {
      position: absolute;
      top: 0;
      left: 0;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      border: 2px solid #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
      pointer-events: none;
      z-index: 10;
    }

    .target-crosshair::before,
    .target-crosshair::after {
      content: '';
      position: absolute;
      background: #ff0055;
    }

    .target-crosshair::before {
      top: 50%; left: -5px; right: -5px; height: 2px; transform: translateY(-50%);
    }

    .target-crosshair::after {
      left: 50%; top: -5px; bottom: -5px; width: 2px; transform: translateX(-50%);
    }

    /* כוונות נעילה על אזור העיניים/פנים */
    .eye-target {
      position: absolute;
      width: 42px;
      height: 42px;
      transform: translate(-50%, -50%);
      border: 2px dashed #ff0055;
      border-radius: 50%;
      box-shadow: 0 0 15px #ff0055;
      pointer-events: none;
      z-index: 4;
      animation: spinEye 3s linear infinite;
    }

    @keyframes spinEye {
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .screen-hit {
      animation: hitShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes hitShake {
      10%, 90% { transform: translate3d(-3px, -2px, 0); filter: brightness(2) drop-shadow(0 0 25px red); }
      20%, 80% { transform: translate3d(5px, 3px, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, -4px, 0); }
      40%, 60% { transform: translate3d(6px, 4px, 0); }
    }
  </style>
</head>
<body>

  <!-- מסך אישור מצלמה מיידי -->
  <div id="start-overlay">
    <h1>CYBER DUEL</h1>
    <button id="start-btn" onclick="startGame()">לחץ כאן להפעלת המצלמה</button>
  </div>

  <div class="arena" id="arena">
    <!-- וידאו היריב -->
    <video id="peer-video" autoplay playsinline muted></video>
    
    <!-- המצלמה שלי לבדיקה עצמית בפינה -->
    <video id="my-video" autoplay playsinline muted></video>

    <div class="scanlines"></div>

    <div class="hud">
      <div class="hp-bar enemy-hp"><div class="fill" id="enemy-hp-fill"></div></div>
      <div class="hp-bar my-hp"><div class="fill" id="my-hp-fill"></div></div>
      
      <div class="target-crosshair" id="crosshair" style="display:none;"></div>
      <div class="eye-target" id="left-eye"></div>
      <div class="eye-target" id="right-eye"></div>

      <div id="alert-banner">AIM FOR THE EYES!</div>
    </div>
  </div>

  <script>
    let myId = sessionStorage.getItem('playerId') || Math.random().toString(36).substring(7);
    sessionStorage.setItem('playerId', myId);

    const room = 'room_cyber_duel_v3_direct';
    let myHp = 100;
    let enemyHp = 100;
    const DAMAGE_PER_HIT = 10;
    
    let crossX = 0, crossY = 0;
    let localStream, peerConnection;

    // ערוץ רשת
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    client.on('connect', () => {
      client.subscribe(room);
    });

    // 1. התחלת המשחק והפעלת המצלמה
    async function startGame() {
      const btn = document.getElementById('start-btn');
      btn.textContent = 'מפעיל מצלמה...';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
      } catch (e) {
        // ניסיון מצלמה ברירת מחדל
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        } catch (err) {
          alert('שגיאת הרשאת מצלמה. וודא שאישרת גישה למצלמה בדפדפן.');
          return;
        }
      }

      // הצגת המצלמה העצמית
      const myVideo = document.getElementById('my-video');
      myVideo.srcObject = localStream;
      myVideo.play();

      document.getElementById('start-overlay').style.display = 'none';
      positionEyeTargets();
      
      // שידור חיבור ליריב
      client.publish(room, JSON.stringify({ type: 'join', sender: myId }));
    }

    // 2. מיקום כוונות העיניים ביחס למרכז המסך (עובד מיידית ללא תלות בקבצי AI חיצוניים)
    function positionEyeTargets() {
      const arena = document.getElementById('arena');
      const rect = arena.getBoundingClientRect();
      
      const centerX = rect.width / 2;
      const centerY = rect.height * 0.42; // גובה עיניים ממוצע בפריים

      const leftEyeEl = document.getElementById('left-eye');
      const rightEyeEl = document.getElementById('right-eye');

      leftEyeEl.style.left = (centerX - 45) + 'px';
      leftEyeEl.style.top = centerY + 'px';

      rightEyeEl.style.left = (centerX + 45) + 'px';
      rightEyeEl.style.top = centerY + 'px';
    }

    window.addEventListener('resize', positionEyeTargets);

    // 3. תנועת כוונת
    function updateAimPosition(clientX, clientY) {
      const rect = document.getElementById('arena').getBoundingClientRect();
      crossX = clientX - rect.left;
      crossY = clientY - rect.top;
      const crosshair = document.getElementById('crosshair');
      crosshair.style.display = 'block';
      crosshair.style.left = crossX + 'px';
      crosshair.style.top = crossY + 'px';
    }

    // 4. ירייה ובדיקת פגיעה בעין
    function fireAction() {
      if (myHp <= 0 || enemyHp <= 0) return;

      const arena = document.getElementById('arena');
      const rect = arena.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height * 0.42;

      const eyeLeft = { x: centerX - 45, y: centerY, r: 35 };
      const eyeRight = { x: centerX + 45, y: centerY, r: 35 };

      const hitLeft = Math.hypot(crossX - eyeLeft.x, crossY - eyeLeft.y) <= eyeLeft.r;
      const hitRight = Math.hypot(crossX - eyeRight.x, crossY - eyeRight.y) <= eyeRight.r;

      const banner = document.getElementById('alert-banner');
      if (hitLeft || hitRight) {
        banner.textContent = 'EYE HIT! -10HP';
        banner.style.color = '#00f0ff';
        banner.classList.add('show');
        setTimeout(() => banner.classList.remove('show'), 600);

        client.publish(room, JSON.stringify({ type: 'laser_hit', sender: myId, damage: DAMAGE_PER_HIT }));
      } else {
        banner.textContent = 'MISSED! AIM FOR THE EYE TARGETS!';
        banner.style.color = '#ff0055';
        banner.classList.add('show');
        setTimeout(() => banner.classList.remove('show'), 500);
      }
    }

    const arenaEl = document.getElementById('arena');
    arenaEl.addEventListener('mousemove', e => updateAimPosition(e.clientX, e.clientY));
    arenaEl.addEventListener('click', () => fireAction());

    arenaEl.addEventListener('touchstart', e => {
      const touch = e.touches[0];
      updateAimPosition(touch.clientX, touch.clientY);
      fireAction();
    }, { passive: true });

    arenaEl.addEventListener('touchmove', e => {
      const touch = e.touches[0];
      updateAimPosition(touch.clientX, touch.clientY);
    }, { passive: true });

    // 5. תקשורת רשת ושידור הווידאו
    client.on('message', async (topic, payload) => {
      const data = JSON.parse(payload.toString());
      if (data.sender === myId) return;

      if (data.type === 'join') {
        client.publish(room, JSON.stringify({ type: 'welcome', sender: myId, target: data.sender }));
        startWebRTC(true);
      }
      if (data.type === 'welcome' && data.target === myId) {
        startWebRTC(false);
      }

      if (data.type === 'signal') {
        if (data.sdp) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
          if (data.sdp.type === 'offer') {
            const ans = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(ans);
            client.publish(room, JSON.stringify({ type: 'signal', sender: myId, sdp: ans }));
          }
        } else if (data.candidate) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      }

      if (data.type === 'laser_hit') {
        myHp = Math.max(0, myHp - data.damage);
        document.getElementById('my-hp-fill').style.width = myHp + '%';
        
        const arena = document.getElementById('arena');
        arena.classList.remove('screen-hit');
        void arena.offsetWidth;
        arena.classList.add('screen-hit');

        client.publish(room, JSON.stringify({ type: 'hp_sync', sender: myId, hp: myHp }));
        if (myHp <= 0) alert('EYES COMPROMISED! YOU LOST!');
      }

      if (data.type === 'hp_sync') {
        enemyHp = data.hp;
        document.getElementById('enemy-hp-fill').style.width = enemyHp + '%';
        if (enemyHp <= 0) alert('SNIPER ELITE! YOU WIN!');
      }
    });

    function startWebRTC(isOffer) {
      peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      
      if (localStream) {
        localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
      }

      peerConnection.ontrack = e => {
        const remoteVideo = document.getElementById('peer-video');
        remoteVideo.srcObject = e.streams[0];
        remoteVideo.play().catch(err => console.log(err));
      };

      peerConnection.onicecandidate = e => {
        if (e.candidate) client.publish(room, JSON.stringify({ type: 'signal', sender: myId, candidate: e.candidate }));
      };

      if (isOffer) {
        peerConnection.createOffer().then(o => {
          peerConnection.setLocalDescription(o);
          client.publish(room, JSON.stringify({ type: 'signal', sender: myId, sdp: o }));
        });
      }
    }
  </script>
</body>
</html>
