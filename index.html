<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Eye-Sniper Duel</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Courier New', Courier, monospace;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #030712;
      touch-action: none;
    }

    /* מסך פתיחה עם עדיפות עליונה מוחלטת */
    #start-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #030712;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      gap: 20px;
      padding: 20px;
    }

    #start-overlay h1 {
      color: #00f0ff;
      font-size: 26px;
      letter-spacing: 2px;
      text-shadow: 0 0 15px #00f0ff;
      text-align: center;
    }

    #start-btn {
      padding: 16px 36px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #030712;
      background: #00f0ff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
      -webkit-appearance: none;
    }

    /* זירת המשחק */
    .arena {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #030712;
    }

    #peer-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(130%) brightness(85%) hue-rotate(180deg) saturate(180%);
      opacity: 0.7;
      transform: scaleX(-1);
    }

    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 240, 255, 0.12) 51%);
      background-size: 100% 4px;
      z-index: 2;
    }

    .hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    #alert-banner {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      text-align: center;
      width: 90%;
      color: #ff0055;
      text-shadow: 0 0 15px #ff0055;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #alert-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }

    .hp-bar {
      position: absolute;
      width: 130px;
      height: 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.5);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
      transform: skewX(-20deg);
      overflow: hidden;
      padding: 1px;
    }

    .enemy-hp { top: 15px; left: 15px; border-color: #ff0055; }
    .my-hp { bottom: 20px; right: 15px; }

    .hp-bar .fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #00f0ff, #38bdf8);
      transition: width 0.25s ease;
    }

    .enemy-hp .fill { background: linear-gradient(90deg, #ff0055, #ff5500); }

    .target-crosshair {
      position: absolute;
      top: 0;
      left: 0;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      border: 2px solid #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
      pointer-events: none;
      z-index: 10;
    }

    .target-crosshair::before,
    .target-crosshair::after {
      content: '';
      position: absolute;
      background: #ff0055;
    }

    .target-crosshair::before {
      top: 50%; left: -5px; right: -5px; height: 2px; transform: translateY(-50%);
    }

    .target-crosshair::after {
      left: 50%; top: -5px; bottom: -5px; width: 2px; transform: translateX(-50%);
    }

    .eye-target {
      position: absolute;
      width: 36px;
      height: 36px;
      transform: translate(-50%, -50%);
      border: 2px dashed #ff0055;
      border-radius: 50%;
      box-shadow: 0 0 12px #ff0055;
      pointer-events: none;
      z-index: 4;
      animation: spinEye 3s linear infinite;
    }

    @keyframes spinEye {
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .screen-hit {
      animation: hitShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes hitShake {
      10%, 90% { transform: translate3d(-3px, -2px, 0); filter: brightness(2) drop-shadow(0 0 25px red); }
      20%, 80% { transform: translate3d(5px, 3px, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, -4px, 0); }
      40%, 60% { transform: translate3d(6px, 4px, 0); }
    }
  </style>
</head>
<body>

  <!-- מסך הפתיחה עם כפתור ברור למובייל -->
  <div id="start-overlay">
    <h1>CYBER DUEL</h1>
    <button id="start-btn" onclick="startGame()">הפעל מצלמה והתחל</button>
  </div>

  <div class="arena" id="arena">
    <video id="peer-video" autoplay playsinline muted></video>
    <div class="scanlines"></div>

    <div class="hud">
      <div class="hp-bar enemy-hp"><div class="fill" id="enemy-hp-fill"></div></div>
      <div class="hp-bar my-hp"><div class="fill" id="my-hp-fill"></div></div>
      
      <div class="target-crosshair" id="crosshair" style="display:none;"></div>
      <div class="eye-target" id="left-eye" style="display:none;"></div>
      <div class="eye-target" id="right-eye" style="display:none;"></div>

      <div id="alert-banner">AIM FOR THE EYES!</div>
    </div>
  </div>

  <script>
    let myId = sessionStorage.getItem('playerId') || Math.random().toString(36).substring(7);
    sessionStorage.setItem('playerId', myId);

    const room = 'room_cyber_sniper_duel_2026';
    let myHp = 100;
    let enemyHp = 100;
    const DAMAGE_PER_HIT = 10;
    
    let crossX = 0, crossY = 0;
    let detectedEyes = [];
    let localStream, peerConnection;

    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    client.on('connect', () => {
      client.subscribe(room);
    });

    async function startGame() {
      const btn = document.getElementById('start-btn');
      btn.textContent = 'טוען מצלמה ומודל...';
      btn.disabled = true;

      await initCamera();
      await loadFaceAI();

      document.getElementById('start-overlay').style.display = 'none';
      client.publish(room, JSON.stringify({ type: 'join', sender: myId }));
    }

    async function initCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 640 } },
          audio: false
        });
      } catch (e) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        } catch (err) {
          alert('חובה לאשר הרשאת מצלמה בדפדפן (וודא פתיחה ב-Chrome או Safari ישירות)');
        }
      }
    }

    async function loadFaceAI() {
      try {
        await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');
        await faceapi.nets.faceLandmark68TinyNet.loadFromUri('https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model');
        startEyeTrackingLoop();
      } catch (e) {
        console.warn('AI loading issue:', e);
      }
    }

    function startEyeTrackingLoop() {
      const video = document.getElementById('peer-video');
      const leftEyeEl = document.getElementById('left-eye');
      const rightEyeEl = document.getElementById('right-eye');
      const arena = document.getElementById('arena');

      setInterval(async () => {
        if (video.readyState >= 2) {
          const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 160 })).withFaceLandmarks(true);
          if (detection) {
            const landmarks = detection.landmarks;
            const leftEyePts = landmarks.getLeftEye();
            const rightEyePts = landmarks.getRightEye();

            const rect = arena.getBoundingClientRect();
            const scaleX = rect.width / video.videoWidth;
            const scaleY = rect.height / video.videoHeight;

            const lX = rect.width - (leftEyePts[0].x * scaleX);
            const lY = leftEyePts[0].y * scaleY;
            const rX = rect.width - (rightEyePts[0].x * scaleX);
            const rY = rightEyePts[0].y * scaleY;

            detectedEyes = [
              { x: lX, y: lY, radius: 36 },
              { x: rX, y: rY, radius: 36 }
            ];

            leftEyeEl.style.display = rightEyeEl.style.display = 'block';
            leftEyeEl.style.left = lX + 'px';
            leftEyeEl.style.top = lY + 'px';
            rightEyeEl.style.left = rX + 'px';
            rightEyeEl.style.top = rY + 'px';
          }
        }
      }, 100);
    }

    function updateAimPosition(clientX, clientY) {
      const rect = document.getElementById('arena').getBoundingClientRect();
      crossX = clientX - rect.left;
      crossY = clientY - rect.top;
      const crosshair = document.getElementById('crosshair');
      crosshair.style.display = 'block';
      crosshair.style.left = crossX + 'px';
      crosshair.style.top = crossY + 'px';
    }

    function fireAction() {
      if (myHp <= 0 || enemyHp <= 0) return;

      let hitEye = false;
      for (let eye of detectedEyes) {
        const dist = Math.hypot(crossX - eye.x, crossY - eye.y);
        if (dist <= eye.radius) {
          hitEye = true;
          break;
        }
      }

      const banner = document.getElementById('alert-banner');
      if (hitEye) {
        banner.textContent = 'EYE HIT! -10HP';
        banner.style.color = '#00f0ff';
        banner.classList.add('show');
        setTimeout(() => banner.classList.remove('show'), 600);

        client.publish(room, JSON.stringify({ type: 'laser_hit', sender: myId, damage: DAMAGE_PER_HIT }));
      } else {
        banner.textContent = 'MISSED! TARGET THE EYES!';
        banner.style.color = '#ff0055';
        banner.classList.add('show');
        setTimeout(() => banner.classList.remove('show'), 500);
      }
    }

    const arenaEl = document.getElementById('arena');
    arenaEl.addEventListener('mousemove', e => updateAimPosition(e.clientX, e.clientY));
    arenaEl.addEventListener('click', () => fireAction());

    arenaEl.addEventListener('touchstart', e => {
      const touch = e.touches[0];
      updateAimPosition(touch.clientX, touch.clientY);
      fireAction();
    }, { passive: true });

    arenaEl.addEventListener('touchmove', e => {
      const touch = e.touches[0];
      updateAimPosition(touch.clientX, touch.clientY);
    }, { passive: true });

    client.on('message', async (topic, payload) => {
      const data = JSON.parse(payload.toString());
      if (data.sender === myId) return;

      if (data.type === 'join') {
        client.publish(room, JSON.stringify({ type: 'welcome', sender: myId, target: data.sender }));
        startWebRTC(true);
      }
      if (data.type === 'welcome' && data.target === myId) startWebRTC(false);

      if (data.type === 'signal') {
        if (data.sdp) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
          if (data.sdp.type === 'offer') {
            const ans = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(ans);
            client.publish(room, JSON.stringify({ type: 'signal', sender: myId, sdp: ans }));
          }
        } else if (data.candidate) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        }
      }

      if (data.type === 'laser_hit') {
        myHp = Math.max(0, myHp - data.damage);
        document.getElementById('my-hp-fill').style.width = myHp + '%';
        
        const arena = document.getElementById('arena');
        arena.classList.remove('screen-hit');
        void arena.offsetWidth;
        arena.classList.add('screen-hit');

        client.publish(room, JSON.stringify({ type: 'hp_sync', sender: myId, hp: myHp }));
        if (myHp <= 0) alert('EYES COMPROMISED! YOU LOST!');
      }

      if (data.type === 'hp_sync') {
        enemyHp = data.hp;
        document.getElementById('enemy-hp-fill').style.width = enemyHp + '%';
        if (enemyHp <= 0) alert('SNIPER ELITE! YOU WIN!');
      }
    });

    function startWebRTC(isOffer) {
      peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
      if (localStream) localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

      peerConnection.ontrack = e => {
        const remoteVideo = document.getElementById('peer-video');
        remoteVideo.srcObject = e.streams[0];
        remoteVideo.play().catch(err => console.log('Autoplay play error:', err));
      };
      peerConnection.onicecandidate = e => {
        if (e.candidate) client.publish(room, JSON.stringify({ type: 'signal', sender: myId, candidate: e.candidate }));
      };
      if (isOffer) {
        peerConnection.createOffer().then(o => {
          peerConnection.setLocalDescription(o);
          client.publish(room, JSON.stringify({ type: 'signal', sender: myId, sdp: o }));
        });
      }
    }
  </script>
</body>
</html>
