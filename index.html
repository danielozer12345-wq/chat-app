<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cyber Sniper Duel</title>
  
  <!-- ספריות חיבור ווידאו ישיר ותקשורת קרב -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Courier New', Courier, monospace;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #030712;
      touch-action: none;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #030712;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      gap: 20px;
      padding: 20px;
    }

    #start-overlay h1 {
      color: #00f0ff;
      font-size: 28px;
      letter-spacing: 3px;
      text-shadow: 0 0 15px #00f0ff;
      text-align: center;
    }

    #start-btn {
      padding: 16px 36px;
      font-size: 18px;
      font-weight: 900;
      color: #030712;
      background: #00f0ff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
      -webkit-appearance: none;
    }

    .arena {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #030712;
    }

    /* וידאו היריב במסך המלא */
    #peer-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(130%) brightness(85%) hue-rotate(180deg) saturate(180%);
      opacity: 0.85;
      transform: scaleX(-1);
      z-index: 1;
    }

    /* המצלמה העצמית בפינה */
    #my-video {
      position: absolute;
      bottom: 20px;
      left: 15px;
      width: 90px;
      height: 120px;
      object-fit: cover;
      border: 2px solid #00f0ff;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
      z-index: 10;
      transform: scaleX(-1);
    }

    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 50%, rgba(0, 240, 255, 0.12) 51%);
      background-size: 100% 4px;
      z-index: 2;
    }

    .hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    #status-msg {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #38bdf8;
      text-shadow: 0 0 10px #00f0ff;
      text-align: center;
      width: 90%;
      z-index: 6;
    }

    #alert-banner {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      text-align: center;
      width: 90%;
      color: #ff0055;
      text-shadow: 0 0 15px #ff0055;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    #alert-banner.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }

    .hp-bar {
      position: absolute;
      width: 130px;
      height: 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.5);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
      transform: skewX(-20deg);
      overflow: hidden;
      padding: 1px;
    }

    .enemy-hp { top: 15px; left: 15px; border-color: #ff0055; }
    .my-hp { top: 15px; right: 15px; }

    .hp-bar .fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #00f0ff, #38bdf8);
      transition: width 0.25s ease;
    }

    .enemy-hp .fill { background: linear-gradient(90deg, #ff0055, #ff5500); }

    .target-crosshair {
      position: absolute;
      top: 0;
      left: 0;
      width: 44px;
      height: 44px;
      transform: translate(-50%, -50%);
      border: 2px solid #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.8);
      pointer-events: none;
      z-index: 10;
    }

    .target-crosshair::before,
    .target-crosshair::after {
      content: '';
      position: absolute;
      background: #ff0055;
    }

    .target-crosshair::before {
      top: 50%; left: -5px; right: -5px; height: 2px; transform: translateY(-50%);
    }

    .target-crosshair::after {
      left: 50%; top: -5px; bottom: -5px; width: 2px; transform: translateX(-50%);
    }

    .eye-target {
      position: absolute;
      width: 42px;
      height: 42px;
      transform: translate(-50%, -50%);
      border: 2px dashed #ff0055;
      border-radius: 50%;
      box-shadow: 0 0 15px #ff0055;
      pointer-events: none;
      z-index: 4;
      animation: spinEye 3s linear infinite;
    }

    @keyframes spinEye {
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .screen-hit {
      animation: hitShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }

    @keyframes hitShake {
      10%, 90% { transform: translate3d(-3px, -2px, 0); filter: brightness(2) drop-shadow(0 0 25px red); }
      20%, 80% { transform: translate3d(5px, 3px, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, -4px, 0); }
      40%, 60% { transform: translate3d(6px, 4px, 0); }
    }
  </style>
</head>
<body>

  <div id="start-overlay">
    <h1>CYBER DUEL</h1>
    <button id="start-btn" onclick="startGame()">לחץ כאן להפעלת המשחק</button>
  </div>

  <div class="arena" id="arena">
    <video id="peer-video" autoplay playsinline webkit-playsinline></video>
    <video id="my-video" autoplay playsinline webkit-playsinline muted></video>

    <div class="scanlines"></div>

    <div class="hud">
      <div class="hp-bar enemy-hp"><div class="fill" id="enemy-hp-fill"></div></div>
      <div class="hp-bar my-hp"><div class="fill" id="my-hp-fill"></div></div>
      
      <div class="target-crosshair" id="crosshair" style="display:none;"></div>
      <div class="eye-target" id="left-eye"></div>
      <div class="eye-target" id="right-eye"></div>

      <div id="status-msg">מחבר מצלמות...</div>
      <div id="alert-banner">AIM FOR THE EYES!</div>
    </div>
  </div>

  <script>
    let myId = sessionStorage.getItem('playerId') || Math.random().toString(36).substring(7);
    sessionStorage.setItem('playerId', myId);

    const room = 'room_cyber_duel_peerjs_final_111';
    let myHp = 100;
    let enemyHp = 100;
    const DAMAGE_PER_HIT = 10;
    
    let crossX = 0, crossY = 0;
    let localStream = null;
    let peer = null;
    let myPeerId = null;
    let currentCall = null;

    // ערוץ רשת עבור אירועי משחק בלבד
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    client.on('connect', () => {
      client.subscribe(room);
    });

    async function startGame() {
      const btn = document.getElementById('start-btn');
      btn.textContent = 'מפעיל מצלמה...';
      btn.disabled = true;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
      } catch (err1) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        } catch (err2) {
          alert('שגיאת מצלמה: וודא שאישרת הרשאות בדפדפן.');
          btn.disabled = false;
          btn.textContent = 'נסה שוב';
          return;
        }
      }

      // תצוגת מצלמה מקומית
      const myVideo = document.getElementById('my-video');
      myVideo.muted = true;
      myVideo.playsInline = true;
      myVideo.srcObject = localStream;
      myVideo.onloadedmetadata = () => myVideo.play().catch(e => console.log(e));

      document.getElementById('start-overlay').style.display = 'none';
      positionEyeTargets();

      // הפעלת שרת ה-PeerJS לווידאו
      initPeerJS();
    }

    function initPeerJS() {
      peer = new Peer();

      peer.on('open', (id) => {
        myPeerId = id;
        document.getElementById('status-msg').textContent = 'מחכה ליריב...';
        // שידור ה-Peer ID של השחקן לחדר
        client.publish(room, JSON.stringify({ type: 'ready', sender: myId, peerId: myPeerId }));
      });

      // מענה לשיחת וידאו מהיריב
      peer.on('call', (call) => {
        currentCall = call;
        call.answer(localStream);
        handleStream(call);
      });
    }

    // חיבור הזרם של היריב למסך
    function handleStream(call) {
      call.on('stream', (remoteStream) => {
        const peerVideo = document.getElementById('peer-video');
        peerVideo.muted = true;
        peerVideo.playsInline = true;
        peerVideo.srcObject = remoteStream;
        peerVideo.onloadedmetadata = () => {
          peerVideo.play().catch(e => console.log(e));
          document.getElementById('status-msg').style.display = 'none';
        };
      });
    }

    function positionEyeTargets() {
      const arena = document.getElementById('arena');
      const rect = arena.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height * 0.42;

      const leftEyeEl = document.getElementById('left-eye');
      const rightEyeEl = document.getElementById('right-eye');

      leftEyeEl.style.left = (centerX - 45) + 'px';
      leftEyeEl.style.top = centerY + 'px';

      rightEyeEl.style.left = (centerX + 45) + 'px';
      rightEyeEl.style.top = centerY + 'px';
    }

    window.addEventListener('resize', positionEyeTargets);

    function updateAimPosition(clientX, clientY) {
      const rect = document.getElementById('arena').getBoundingClientRect();
      crossX = clientX - rect.left;
      crossY = clientY - rect.top;
      const crosshair = document.getElementById('crosshair');
      crosshair.style.display = 'block';
      crosshair.style.left = crossX + 'px';
      crosshair.style.top = crossY + 'px';
    }

    function fireAction() {
      if (myHp <= 0 || enemyHp <= 0) return;

      const arena = document.getElementById('arena');
      const rect = arena.getBoundingClientRect();
      const centerX = rect.width / 2;
      const centerY = rect.height * 0.42;

      const eyeLeft = { x: centerX - 45, y: centerY, r: 38 };
      const eyeRight = { x: centerX + 45, y: centerY, r: 38 };

      const hitLeft = Math.hypot(crossX - eyeLeft.x, crossY - eyeLeft.y) <= eyeLeft.r;
      const hitRight = Math.hypot(crossX - eyeRight.x, crossY - eyeRight.y) <= eyeRight.r;

      const banner = document.getElementById('alert-banner');
      if (hitLeft || hitRight) {
        banner.textContent = 'EYE HIT! -10HP';
        banner.style.color = '#00f0ff';
        banner.classList.add('show');
        setTimeout(() => banner.classList.remove('show'), 600);

        client.publish(room, JSON.stringify({ type: 'laser_hit', sender: myId, damage: DAMAGE_PER_HIT }));
      } else {
        banner.textContent = 'MISSED! AIM FOR THE EYE TARGETS!';
        banner.style.color = '#ff0055';
        banner.classList.add('show');
        setTimeout(() => banner.classList.remove('show'), 500);
      }
    }

    const arenaEl = document.getElementById('arena');
    arenaEl.addEventListener('mousemove', e => updateAimPosition(e.clientX, e.clientY));
    arenaEl.addEventListener('click', () => fireAction());

    arenaEl.addEventListener('touchstart', e => {
      const touch = e.touches[0];
      updateAimPosition(touch.clientX, touch.clientY);
      fireAction();
    }, { passive: true });

    arenaEl.addEventListener('touchmove', e => {
      const touch = e.touches[0];
      updateAimPosition(touch.clientX, touch.clientY);
    }, { passive: true });

    // קבלת אירועים דרך MQTT
    client.on('message', (topic, payload) => {
      const data = JSON.parse(payload.toString());
      if (data.sender === myId) return;

      // כשהשחקן השני מוכן -> מחייגים אליו עם ה-Stream המקומי
      if (data.type === 'ready' && peer && localStream) {
        document.getElementById('status-msg').textContent = 'מתחבר לווידאו...';
        const call = peer.call(data.peerId, localStream);
        currentCall = call;
        handleStream(call);
      }

      // נזק ופגיעות
      if (data.type === 'laser_hit') {
        myHp = Math.max(0, myHp - data.damage);
        document.getElementById('my-hp-fill').style.width = myHp + '%';
        
        const arena = document.getElementById('arena');
        arena.classList.remove('screen-hit');
        void arena.offsetWidth;
        arena.classList.add('screen-hit');

        client.publish(room, JSON.stringify({ type: 'hp_sync', sender: myId, hp: myHp }));
        if (myHp <= 0) alert('EYES COMPROMISED! YOU LOST!');
      }

      if (data.type === 'hp_sync') {
        enemyHp = data.hp;
        document.getElementById('enemy-hp-fill').style.width = enemyHp + '%';
        if (enemyHp <= 0) alert('SNIPER ELITE! YOU WIN!');
      }
    });
  </script>
</body>
</html>
