<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>חדר תקשורת</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div class="card">
    <h2>חדר שיחה</h2>
    <p>מחוברים כרגע: <strong id="count">1</strong></p>
    
    <div class="btn-group">
      <button class="action-btn" onclick="send('מה איתך?')" disabled>מה איתך?</button>
      <button class="action-btn green" onclick="send('סבבה!')" disabled>סבבה!</button>
    </div>

    <div id="msg"></div>
  </div>

  <script>
    let myId = sessionStorage.getItem('userId') || Math.random().toString(36).substring(7);
    sessionStorage.setItem('userId', myId);

    const users = new Set([myId]);
    const room = 'room_daniel_chat_peer_888';
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    client.on('connect', () => {
      client.subscribe(room);
      client.publish(room, JSON.stringify({ type: 'ping', sender: myId }));
    });

    client.on('message', (topic, payload) => {
      const data = JSON.parse(payload.toString());
      if (data.type === 'ping') {
        users.add(data.sender);
        client.publish(room, JSON.stringify({ type: 'pong', sender: myId }));
        update();
      }
      if (data.type === 'pong') { users.add(data.sender); update(); }
      if (data.type === 'bye') { users.delete(data.sender); update(); }
      if (data.type === 'msg' && data.sender !== myId) {
        document.getElementById('msg').textContent = data.text;
      }
    });

    window.addEventListener('beforeunload', () => {
      client.publish(room, JSON.stringify({ type: 'bye', sender: myId }));
    });

    function update() {
      const total = users.size;
      document.getElementById('count').textContent = total;
      const buttons = document.querySelectorAll('.action-btn');
      buttons.forEach(btn => btn.disabled = (total < 2));
    }

    function send(text) {
      client.publish(room, JSON.stringify({ type: 'msg', sender: myId, text: text }));
    }
  </script>
</body>
</html>
